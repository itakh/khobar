@media (min-width:900px){.bilah-pilih{bottom:14px}}
.atau{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0 10px}.atau::before,.atau::after{content:'';flex:1;height:1px;background:var(--garis)}
 
.materi-kartu{text-align:left;width:100%;display:block}
.materi-kartu .atas{display:flex;gap:10px;align-items:flex-start}.materi-kartu .atas .isi{flex:1;min-width:0}.materi-kartu .atas b{display:block;font-size:15px;line-height:1.35}
.materi-kartu .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.materi-kartu .cuplikan{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.materi-kartu .bawah{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}.materi-kartu .bawah .chip svg{margin-right:3px}
.materi-kartu.baru{box-shadow:0 0 0 1.5px var(--aksen),var(--bayang)}
.mt-ikon{width:40px;height:40px;border-radius:12px;background:var(--merek-muda);color:var(--merek);display:grid;place-items:center;flex:none}
.titik-baru{width:10px;height:10px;border-radius:50%;background:var(--aksen);flex:none;margin-top:6px}
.reaksi-mini{display:flex;width:70px;height:7px;border-radius:9px;overflow:hidden;background:var(--garis)}.reaksi-mini i{display:block;height:100%}
.amanah-garis{display:flex;gap:8px;align-items:center;width:100%;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--aksen-muda);color:var(--aksen-tua);font-size:12.5px;text-align:left}
.ringkasan{font-size:15px;line-height:1.75}.ringkasan p{margin:0 0 4px}.ringkasan h4{font-size:15.5px;color:var(--merek);margin:12px 0 4px}.ringkasan ul{margin:2px 0 8px 20px}.ringkasan li{margin:2px 0}.ringkasan .sela{height:8px}
.lampiran-grid{display:grid;gap:10px}
@media (min-width:700px){.lampiran-grid{grid-template-columns:1fr 1fr}.lampiran-grid .lamp-drive{grid-column:1/-1}}
.lamp{border:1.5px solid var(--garis);border-radius:14px;padding:10px;background:#fff;min-width:0}
.lamp-kepala{display:flex;gap:10px;align-items:center}.lamp-kepala .isi{flex:1;min-width:0}.lamp-kepala b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lamp-kepala small{font-size:12px;color:var(--muted)}
.lamp-ik{width:36px;height:36px;border-radius:10px;background:var(--merek-muda);color:var(--merek);display:grid;place-items:center;flex:none}.lamp-ik.kecil{width:30px;height:30px}
.lamp-isi{margin-top:8px}
.lamp-gambar{padding:0;overflow:hidden}.lamp-gambar img{display:block;width:100%;max-height:340px;object-fit:contain;background:var(--bg);cursor:zoom-in;-webkit-user-select:none;user-select:none}
.gambar-tunggu{height:180px;display:grid;place-items:center;background:var(--bg)}.gambar-tunggu .spin{border-color:rgba(9,82,73,.15);border-top-color:var(--merek)}
.lamp-kaki{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:12.5px;color:var(--muted)}.lamp-kaki .amanah-ik{margin-left:auto}
.amanah-ik{color:var(--aksen-tua)}
.amanah-teks{margin-left:8px;color:var(--aksen-tua);text-transform:none;letter-spacing:0;font-weight:600}
.lamp-demo{background:var(--bg);border-radius:10px;padding:14px;font-size:12.5px;color:var(--muted);text-align:center}
iframe.drive-pemutar{width:100%;height:360px;border:0;border-radius:10px;background:var(--bg)}iframe.drive-pemutar.audio{height:120px}
.reaksi-pilih{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reaksi-pilih button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:1.5px solid var(--garis);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted)}
.reaksi-pilih button svg{width:24px;height:24px;color:var(--c)}
.reaksi-pilih button.on{border-color:var(--c);background:var(--bg);color:var(--c);background:var(--bg)}
.reaksi-pilih button.on{background:var(--bg)}
.reaksi-rekap details{border-bottom:1px solid var(--garis);padding:8px 0}.reaksi-rekap summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}.reaksi-rekap summary::-webkit-details-marker{display:none}
.reaksi-rekap .lbl{width:170px;font-weight:600;font-size:13px;flex:none}.reaksi-rekap .bar-mini{flex:1;max-width:none}.reaksi-rekap details .hint{margin-top:6px}
.kom{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--garis)}.kom .isi{flex:1;min-width:0}
.kom .kepala{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.kom .kepala b{font-size:13.5px}.kom .kepala small{color:var(--muted);font-size:11.5px;margin-left:auto}
.kom .teks-soal{font-size:14px;margin-top:2px}
.kom .aksi{display:flex;gap:12px;margin-top:4px}.kom .aksi button{font-size:12px;color:var(--muted);font-weight:600}.kom .aksi button:hover{color:var(--merek)}
.kom.semat{background:var(--aksen-muda);margin:0 -10px;padding:10px;border-radius:12px;border:0}
.kom.dihapus{padding:8px 0}
.balasan{margin-left:42px;border-left:2px solid var(--garis);padding-left:10px}
.kom-tulis{margin-top:12px}.kom-tulis textarea{min-height:76px}
.inisial.m{background:var(--merek);color:#fff}
.ringkasan .baris-ar{text-align:right}.ringkasan li[dir=rtl]{margin-right:20px;margin-left:0}
 
.stim-kartu{margin-bottom:10px}.stim-kartu .atas{display:flex;gap:10px;align-items:center}.stim-kartu .atas .isi{flex:1;min-width:0}.stim-kartu .atas b{display:block;font-size:15px}.stim-kartu .meta{font-size:12.5px;color:var(--muted)}
.stim-soal{margin-top:10px;border-top:1px solid var(--garis);padding-top:6px}
.baris-mini{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 4px;border-radius:10px;font-size:13.5px}.baris-mini:hover{background:var(--bg)}.baris-mini .teks-soal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.baris-mini .no{width:24px;height:24px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.stim-layar{text-align:center}.stim-layar h3{font-size:18px;margin:10px 0 6px}.stim-layar .petunjuk{color:var(--muted);font-size:14.5px;margin-bottom:6px}
.pemutar{display:flex;flex-direction:column;align-items:center;gap:12px;margin:18px auto 6px;max-width:420px}
.pemutar .putar{width:84px;height:84px;border-radius:50%;background:var(--merek);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(9,82,73,.3);transition:transform .1s}
.pemutar .putar svg{width:36px;height:36px}.pemutar .putar:active{transform:scale(.95)}.pemutar .putar[disabled]{background:#AEB7C6;box-shadow:none}
.pemutar .putar.jalan{background:var(--aksen)}.pemutar .putar .spin{width:30px;height:30px}
.pemutar .jalur{width:100%;height:8px;border-radius:9px;background:var(--garis);overflow:hidden}.pemutar .jalur i{display:block;height:100%;width:0;background:var(--merek);transition:width .25s linear}
.pemutar .waktu{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sisa-putar{font-size:14px;margin-top:4px}
.uj-bacaan{background:var(--aksen-muda);border-radius:14px;padding:10px 14px;margin-bottom:14px;max-width:760px;margin-left:auto;margin-right:auto}
.uj-bacaan summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--aksen-tua)}.uj-bacaan .ringkasan{margin-top:8px;max-height:46vh;overflow:auto}
.stim-review{background:var(--aksen-muda);border-radius:14px;padding:10px 14px;margin:14px 0 8px}.stim-review .kepala{display:flex;gap:8px;align-items:center;color:var(--aksen-tua)}.stim-review summary{cursor:pointer;font-size:13px;font-weight:600;margin-top:6px}
.grid-no button{position:relative}
#ujian.coba::after,#kuis.coba::after{content:'Mode coba · tidak disimpan';position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:var(--aksen);color:#1B2638;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:99px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
#kuis.coba::after{top:calc(64px + env(safe-area-inset-top));bottom:auto}.grid-no .tanda-stim{position:absolute;top:2px;right:3px;opacity:.75;line-height:0}.grid-no .tanda-stim svg{width:11px;height:11px}
</style>

    var t0 = $('#t-total'); if (t0 && isFinite(A.el.duration)) t0.textContent = fDurasi(A.el.duration * 1000);
  };
  var siapkan = function () {
    if (A || (st.batasPutar && st.n >= st.batasPutar)) return Promise.resolve(A);
    tombol.classList.add('muat'); tombol.innerHTML = '<span class="spin"></span>';
    return callUj('ujianStimulusAudio', { id: UJ.id, stimulusId: st.id }).then(function (r) {
      var url = urlDariB64(r.data, r.mime), el = new Audio(url); el.preload = 'auto';
      A = UJ.audio = { sid: st.id, el: el, url: url };
      tombol.classList.remove('muat'); pasangA(); segarTombol(); return A;
    }, function (e) { tombol.classList.remove('muat'); segarTombol(); toast(e.message, 'galat'); throw e; });
  };
  var segarTombol = function () {
    if (!tombol.isConnected) return;
    var habis = st.batasPutar && st.n >= st.batasPutar && !sedang;
    tombol.disabled = !!habis; tombol.classList.toggle('jalan', sedang);
    tombol.innerHTML = ik(sedang ? 'jeda' : 'putar');
  };
  segarTombol(); pasangA();
  siapkan().catch(function () {});
  tombol.onclick = function () {
    if (sedang) { A.el.pause(); sedang = false; segarTombol(); return; }
    if (A && A.el.currentTime > 0 && !A.el.ended) { A.el.play(); sedang = true; segarTombol(); return; }
    proses(tombol, function () { return siapkan().then(function () { return callUj('ujianStimulusPutar', { id: UJ.id, stimulusId: st.id }); }); }).then(function (r) {
      st.n = r.n; A.el.currentTime = 0;
      A.el.play().then(function () { sedang = true; segarTombol(); }, function () { toast('Audio tidak bisa diputar di perangkat ini.', 'galat'); });
      var sp = $('#sisa-putar'); if (sp) sp.innerHTML = r.sisa === null ? 'Audio boleh diputar berulang kali.' : r.sisa ? 'Putaran ke-' + r.n + '. Sisa kesempatan: <b>' + r.sisa + ' kali</b>' : 'Ini putaran terakhir.';
      segarTombol();
    }, function () {});
  };
  $('#uj-mundur').onclick = function () { if (A) A.el.pause(); UJ.i = awal - 1; gambarUjian(); };
  $('#uj-grid').onclick = function () { if (A) A.el.pause(); gridNomor(); };
  $('#uj-lanjut-stim').onclick = function () {
    var belum = !st.n, sisaN = st.batasPutar ? st.batasPutar - st.n : 1;
    konfirmasi({ judul: 'Lanjut ke soal?', pesan: belum ? '<b>Anda belum memutar audio.</b> Setelah lanjut, audio tidak bisa diputar lagi.' : (sisaN > 0 && st.batasPutar ? 'Masih ada ' + sisaN + ' kesempatan memutar. ' : '') + 'Setelah lanjut, bagian audio ini tidak bisa dibuka lagi.', ya: 'Lanjut ke soal' }).then(function (y) {
      if (!y) return;
      callUj('ujianStimulusLewat', { id: UJ.id, stimulusId: st.id }).then(function () {
        st.lewat = true; if (A) { A.el.pause(); URL.revokeObjectURL(A.url); UJ.audio = null; }
        UJ.i = awal; gambarUjian();
      }, function (e) { toast(e.message, 'galat'); });
    });
  };
}
